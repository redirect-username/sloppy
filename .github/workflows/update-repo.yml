name: Update package index

on:
  push:
    paths:
      - 'debs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev bzip2 xz-utils

      - name: Generate Packages files
        run: |
          dpkg-scanpackages -m debs /dev/null > Packages
          gzip -9kf Packages
          bzip2 -9kf Packages
          xz -9kf Packages
          touch .nojekyll

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update package index"
          git push
